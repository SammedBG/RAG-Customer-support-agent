[project]
name = "rag-customer-support-agent"
version = "1.0.0"
description = "Production-grade RAG Customer Support Agent with hybrid search, source citations, and evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # --- LLM & Orchestration ---
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-community>=0.3.0",

    # --- Data Plane (Ingestion & Retrieval) ---
    "llama-index>=0.11.0",
    "llama-index-core>=0.11.0",
    "llama-index-readers-file>=0.2.0",
    "llama-index-embeddings-openai>=0.2.0",

    # --- Vector Database ---
    "qdrant-client>=1.11.0",

    # --- Embeddings ---
    "openai>=1.40.0",
    "fastembed>=0.4.0",

    # --- API ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # --- Security ---
    "python-jose[cryptography]>=3.3.0",
    "slowapi>=0.1.9",
    "passlib[bcrypt]>=1.7.4",

    # --- Evaluation ---
    "ragas>=0.2.0",
    "deepeval>=1.0.0",

    # --- Utilities ---
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101"]  # Allow assert in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

